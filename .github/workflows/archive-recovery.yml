name: Check Dogdrip Automation

on:
  schedule:
    # Bangkok 10:05, 10:20, 10:45 and 11:15: bounded backups to the 10:00 collection.
    - cron: "5,20,45 3 * * *"
    - cron: "15 4 * * *"
  workflow_run:
    workflows: [Daily Dogdrip Archive, Deploy Dogdrip Site]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: dogdrip-recovery-check
  cancel-in-progress: false

env:
  ARCHIVE_TIMEZONE: Asia/Bangkok

jobs:
  check:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: dogdrip_bot
      - name: Check and recover missed collection or stale deployment
        run: python dogdrip_bot/automation_health.py check
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RECOVERY_TRIGGER: ${{ github.event.workflow_run.name }}
