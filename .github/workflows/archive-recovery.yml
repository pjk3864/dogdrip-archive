name: Check Dogdrip Automation

on:
  push:
    branches: [main]
    paths: ['.github/workflows/archive-recovery.yml']
  schedule:
    # Check all day, away from the busy hour boundary. Collection starts only after 10:00 Bangkok.
    - cron: "7,22,37,52 * * * *"
  workflow_run:
    workflows: [Daily Dogdrip Archive, Deploy Dogdrip Site]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: dogdrip-recovery-check
  cancel-in-progress: false

env:
  ARCHIVE_TIMEZONE: Asia/Bangkok

jobs:
  check:
    if: github.event_name != 'push' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: dogdrip_bot
      - name: Check and recover missed collection or stale deployment
        run: python dogdrip_bot/automation_health.py check
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RECOVERY_TRIGGER: ${{ github.event.workflow_run.name }}


  route_probe:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check the two official article routes
        run: |
          python - <<'PY_ROUTE'
          import json, time
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError
          for path in ["/734477686", "/dogdrip/734477686"]:
              url = "https://www.dogdrip.net" + path
              request = Request(url, headers={"User-Agent": "Mozilla/5.0"})
              try:
                  with urlopen(request, timeout=30) as response:
                      status, data = response.status, response.read()
              except HTTPError as error:
                  status, data = error.code, error.read()
              print(json.dumps({"url": url, "status": status, "bytes": len(data), "article": b"document_734477686" in data and b"rhymix_content" in data}), flush=True)
              time.sleep(1)
          PY_ROUTE
