name: Check Dogdrip Automation

on:
  push:
    branches: [main]
    paths: ['.github/workflows/archive-recovery.yml']
  schedule:
    # Check all day, away from the busy hour boundary. Collection starts only after 10:00 Bangkok.
    - cron: "7,22,37,52 * * * *"
  workflow_run:
    workflows: [Daily Dogdrip Archive, Deploy Dogdrip Site]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: dogdrip-recovery-check
  cancel-in-progress: false

env:
  ARCHIVE_TIMEZONE: Asia/Bangkok

jobs:
  check:
    if: github.event_name != 'push' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: dogdrip_bot
      - name: Check and recover missed collection or stale deployment
        run: python dogdrip_bot/automation_health.py check
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RECOVERY_TRIGGER: ${{ github.event.workflow_run.name }}


  import_snapshot:
    if: github.event_name == 'push'
    permissions:
      contents: write
      actions: write
    concurrency:
      group: dogdrip-daily-archive
      cancel-in-progress: false
    env:
      RECOVERY_BRANCH: recovery/current-rest-20261111
      RECORD_COMPLETE: 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          sparse-checkout: |
            .github/scripts
            dogdrip_bot
            posts
      - name: Import preserved posts and media
        run: |
          git fetch --depth=1 --no-filter origin "$RECOVERY_BRANCH"
          python .github/scripts/import_local_snapshot.py FETCH_HEAD
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Import locally collected Dogdrip posts and media'
          git push origin HEAD:main
      - name: Record collection and deploy
        run: |
          if [ "$RECORD_COMPLETE" = true ]; then
            python dogdrip_bot/automation_health.py complete
          fi
          gh workflow run deploy-pages.yml --ref main
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
