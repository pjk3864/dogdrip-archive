name: Daily Dogdrip Archive
run-name: Daily Dogdrip Archive (${{ inputs.pending_only && 'pending retry' || 'full collection' }}; recovery ${{ inputs.recovery_attempt || 0 }})

on:
  schedule:
    # Prepare at 09:50 Bangkok; the collection step waits until 10:00.
    - cron: "50 2 * * *"
  workflow_dispatch:
    inputs:
      pending_only:
        description: Retry only already queued posts
        type: boolean
        default: false
      recovery_attempt:
        description: Automatic recovery attempt
        type: number
        default: 0

env:
  ARCHIVE_TIMEZONE: Asia/Bangkok

permissions:
  contents: write

concurrency:
  group: dogdrip-daily-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out archive
        uses: actions/checkout@v5
        with:
          sparse-checkout: dogdrip_bot

      - name: Skip already completed scheduled collection
        id: guard
        run: python dogdrip_bot/automation_health.py gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RECOVERY_ATTEMPT: ${{ inputs.recovery_attempt || 0 }}

      - name: Set up Python
        if: steps.guard.outputs.run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: dogdrip_bot/requirements.txt

      - name: Install dependencies
        if: steps.guard.outputs.run == 'true'
        run: python -m pip install -r requirements.txt
        working-directory: dogdrip_bot

      - name: Archive new posts
        if: steps.guard.outputs.run == 'true'
        run: |
          if [ "${{ github.event_name }}" = schedule ]; then
            python automation_health.py wait
          fi
          for attempt in 1 2 3; do
            if xvfb-run --auto-servernum python bot.py; then
              exit 0
            fi
            if [ "$attempt" = 3 ]; then
              exit 1
            fi
            echo "::warning::수집 중단: 재시도 목록을 보존하고 ${attempt}차 재시도합니다."
            sleep "$((attempt * 30))"
          done
        working-directory: dogdrip_bot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCHIVE_PENDING_ONLY: ${{ inputs.pending_only && '1' || '0' }}

      - name: Record completed full collection
        if: steps.guard.outputs.run == 'true' && !inputs.pending_only
        run: python dogdrip_bot/automation_health.py complete
        env:
          GITHUB_TOKEN: ${{ github.token }}

