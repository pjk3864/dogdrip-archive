name: Diagnose Dogdrip Source Access
run-name: Diagnose Dogdrip Source Access 2026-11-21

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: dogdrip_bot

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --quiet -r dogdrip_bot/requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq chromium-browser || sudo apt-get install -y -qq chromium

      - name: Run source diagnostics
        run: python dogdrip_bot/diagnose_source.py
