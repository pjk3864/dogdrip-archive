name: Dogdrip Archive Unit Tests

on:
  pull_request:
    paths:
      - 'dogdrip_bot/**'
      - '.github/workflows/archive-unit-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: dogdrip_bot/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r dogdrip_bot/requirements.txt
      - name: Unit tests (no network, no archive writes)
        run: python -m unittest discover -s dogdrip_bot -v
