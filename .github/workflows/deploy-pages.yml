name: Deploy Dogdrip Site
run-name: Deploy Dogdrip Site (recovery ${{ inputs.recovery_attempt || 0 }})

on:
  workflow_dispatch:
    inputs:
      recovery_attempt:
        description: Automatic recovery attempt
        type: number
        default: 0
  workflow_run:
    workflows: [Daily Dogdrip Archive]
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'dogdrip_bot/**'
      - README.md
      - cold-storage.json

permissions:
  contents: read
  actions: write
  pages: write
  id-token: write

concurrency:
  group: dogdrip-pages
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.gate.outputs.deploy }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: dogdrip_bot
      - name: Check whether collection actually ran
        id: gate
        run: python dogdrip_bot/automation_health.py deployment-gate
        env:
          GITHUB_TOKEN: ${{ github.token }}

  deploy:
    needs: prepare
    if: needs.prepare.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment_retry.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - name: Check out site files
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            posts
            dogdrip_bot

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build site with preserved external media
        run: python dogdrip_bot/build_site.py --output _site

      - name: Upload small site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Stop competing branch-based Pages runs
        run: python dogdrip_bot/wait_for_pages.py
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Deploy site
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait for competing Pages deployment before retry
        if: steps.deployment.outcome == 'failure'
        run: python dogdrip_bot/wait_for_pages.py
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Retry site deployment
        if: steps.deployment.outcome == 'failure'
        id: deployment_retry
        uses: actions/deploy-pages@v5
